[project]
name = "fastapi-common"
version = "0.0.0"
description = "Shared FastAPI infra"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.165.0",
    "pydantic-settings>=2.16.3",
    "sqlalchemy[asyncio]>=2.1.9",
]

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"
